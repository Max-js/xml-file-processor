services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: maxsmith
      POSTGRES_PASSWORD: maxsmith
      POSTGRES_DB: maxsmith
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxsmith"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
